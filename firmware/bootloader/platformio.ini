;
; HID bootloader of the Disled lamp (prototype), a project of its own: it
; shares the toolchain of the firmware but none of its code.
;
; Build environments:
;   bootloader      the bootloader, 4 KB at the start of the flash (default)
;   native          unit tests of lib/bl_core on the build machine
;   native_bitwise  the same tests with the table-less CRC-32
;
; From this folder: uv run pio run, uv run pio test -e native.

[platformio]
default_envs = bootloader

[env:bootloader]
; Same platform and SDK as the firmware (../platformio.ini).
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#afe523b090566de3c8f3f21c807bde0cbdfa21da
platform_packages =
    framework-wch-noneos-sdk @ https://github.com/Community-PIO-CH32V/framework-wch-noneos-sdk.git#4ba4a2665b6263564fd4ac8d9f58ba433532d4e2
board = genericCH32V203G6U6
framework = noneos-sdk
; Our own startup and linker script: main() stays in machine mode, so that
; the application starts as after a reset, and nothing from the SDK runs
; before the boot decision. The SDK system code only provides a header the
; device header includes; the linker drops the unused SystemInit().
board_build.use_builtin_startup_file = no
board_build.use_builtin_debug_code = no
board_build.cpp_support = no
board_build.use_lto = yes
board_build.clock_source = hsi
board_build.ldscript = link.ld
; The budget of scripts/size_budget.py: one 4 KB write-protect sector.
board_upload.maximum_size = 4096
upload_protocol = isp
; Without the save/restore millicode of the platform flags: 48 bytes less
; here, where few functions remain after LTO.
build_unflags =
    -std=gnu99
    -msave-restore
build_flags =
    -std=gnu11
    -Isrc
build_src_flags =
    -Wextra
    -Werror
    -Wshadow
    -Wdouble-promotion
    -Wformat=2
    -Wmissing-prototypes
    -Wstrict-prototypes
    -Wvla
extra_scripts =
    post:../scripts/size_budget.py
    post:../scripts/ihex.py
; Static analysis as in the firmware (pio check), on our code only.
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<lib/bl_core/>
check_flags =
    cppcheck: --enable=warning,style,performance,portability --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression
check_severity = low, medium, high

[env:native]
platform = native@1.2.1
test_framework = unity
build_flags =
    -std=c11
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wconversion
    -Wno-sign-conversion

[env:native_bitwise]
extends = env:native
build_flags =
    ${env:native.build_flags}
    -DBL_CRC32_TABLE=0
