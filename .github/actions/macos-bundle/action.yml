name: macOS bundle checks
description: >-
  Checks the app and the disk image that `tauri build` wrote into
  target/release/bundle, for the pull requests and for the releases alike.
runs:
  using: composite
  steps:
    # Apple Silicon calls an app downloaded without any signature
    # "damaged" and offers only the bin, as issue #19 showed, so the bundle,
    # wchisp included, must carry the ad-hoc signature of tauri.conf.json.
    - name: Check the macOS signature
      shell: bash
      working-directory: target/release/bundle/macos
      run: codesign --verify --deep --strict --verbose=2 Disled.app

    # The calls come from the microphone without any permission: a bundle
    # that declared the use of the microphone or of the camera would have
    # macOS ask the user, and the detection of the calls would be gone.
    - name: No microphone or camera permission
      shell: bash
      working-directory: target/release/bundle/macos
      run: |
        plist=$(plutil -convert xml1 -o - Disled.app/Contents/Info.plist)
        if grep -E -q 'NS(Microphone|Camera)UsageDescription' <<< "$plist"; then
          echo "::error::Info.plist asks for the microphone or the camera"
          exit 1
        fi

    # The app lives in the menu bar, so the bundle must make it an agent app,
    # with no Dock tile even while it launches (app/src-tauri/Info.plist).
    - name: An agent app, without a Dock tile
      shell: bash
      working-directory: target/release/bundle/macos
      run: |
        if [ "$(plutil -extract LSUIElement raw -o - Disled.app/Contents/Info.plist)" != true ]; then
          echo "::error::Info.plist does not make Disled an agent app (LSUIElement)"
          exit 1
        fi

    # The disk image window shows its background, with the first-launch
    # steps, only if Finder saved its layout into the image.
    - name: Check the disk image layout
      shell: bash
      working-directory: target/release/bundle/dmg
      run: |
        mount=$(mktemp -d)
        hdiutil attach -readonly -nobrowse -mountpoint "$mount" Disled_*.dmg
        trap 'hdiutil detach "$mount"' EXIT
        grep -q backgroundImageAlias "$mount/.DS_Store"
