name: app

# Checks of the pull requests into main that are ready for review, drafts
# aside. The release workflow builds the installers.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "crates/**"
      - "tools/**"
      - "protocol/**"
      - "docs/plugins/plugin.schema.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".github/workflows/app.yml"
      - ".github/actions/**"

permissions:
  contents: read

# A new push to the pull request cancels the checks of the previous one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The flasher of the release workflow, which says what to check before
  # changing it.
  WCHISP_VERSION: 0.3.0

jobs:
  app:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tauri and hidapi system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/package.json
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The newest npm that engines in app/package.json allows, rather than
      # the one that comes with Node.
      - run: npm install --global "npm@$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/package.json').engines.npm")"

      # The version of rust-toolchain.toml, with clippy and rustfmt.
      - run: rustup toolchain install

      # Rust workspace at the repository root.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Front end
        run: |
          npm ci
          npx biome ci .
          npm run build

      - name: Front-end unit tests
        run: npm test

      # The tests write the TypeScript types of the front end again with
      # ts-rs, into an emptied folder, so that a type renamed or removed in
      # Rust leaves no file behind.
      - name: Rust workspace (app, shared crates, tools)
        working-directory: .
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          rm -r app/src/bindings
          cargo test --workspace

      # A changed, new or missing file fails the check.
      - name: TypeScript types up to date with the Rust types
        working-directory: .
        run: |
          git status --porcelain -- app/src/bindings
          test -z "$(git status --porcelain -- app/src/bindings)"

  # The code behind #[cfg(target_os = ...)] compiles and runs its tests on
  # the systems of the releases too, long before a release. On Windows, the
  # job also builds the installer. On macOS, it builds the disk image as the
  # release does, wchisp included, checks it, and attaches it: the test
  # build of the Mac.
  native:
    if: ${{ !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: app/package.json
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The newest npm that engines in app/package.json allows, rather than
      # the one that comes with Node.
      - run: npm install --global "npm@$(node -p "require(process.env.GITHUB_WORKSPACE + '/app/package.json').engines.npm")"

      # The version of rust-toolchain.toml, with clippy.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # The app embeds the built front end.
      - name: Front end
        run: |
          npm ci
          npm run build

      - name: App and flashing crate
        working-directory: .
        run: |
          cargo clippy -p disled-app -p disled-flash --all-targets -- -D warnings
          cargo test -p disled-app -p disled-flash

      # The installer hook, src-tauri/installer/nsis-hooks.nsh, relies on
      # the NSIS template of the Tauri CLI: a CLI update that breaks it
      # fails here rather than in the release. Without the updater
      # configuration and wchisp, which the hook does not need.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis

      - uses: ./.github/actions/wchisp
        if: runner.os == 'macOS'
        with:
          version: ${{ env.WCHISP_VERSION }}

      # Without the updater configuration, so without its signing secrets.
      - name: Build the disk image
        if: runner.os == 'macOS'
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: npm run tauri build -- --bundles app,dmg --config src-tauri/tauri.wchisp.conf.json

      - uses: ./.github/actions/macos-bundle
        if: runner.os == 'macOS'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'macOS'
        with:
          name: disled-macos-${{ github.sha }}
          path: target/release/bundle/dmg/Disled_*.dmg
          if-no-files-found: error
